<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mortgage & Investment Calculator</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .grid.three {
      grid-template-columns: 1fr 1fr 1fr;
	  gap: 40px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px 0 10px 10px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: right;
    }

    th {
      background-color: #f0f0f0;
      text-align: center;
    }

    td:first-child {
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mortgage & Investment Calculator</h1>

    <h2>Mortgage</h2>
    <div class="grid">
      <div class="form-group">
        <label>Mortgage Amount</label>
        <input type="number" id="mortgageAmount" value="500000" />
      </div>
      <div class="form-group">
        <label>Annual Interest Rate (%)</label>
        <input type="number" step="0.01" id="mortgageRate" value="6" />
      </div>
    </div>

    <h2>Bank Savings</h2>
    <div class="grid three">
      <div class="form-group">
        <label>Current Bank Balance</label>
        <input type="number" id="bankAmount" value="100000" />
      </div>
      <div class="form-group">
        <label>Annual Bank Interest Rate (%)</label>
        <input type="number" step="0.01" id="bankRate" value="3" />
      </div>
      <div class="form-group">
        <label>Monthly Bank Contribution</label>
        <input type="number" id="bankMonthly" value="2000" />
      </div>
    </div>

    <h2>Stock Investments</h2>
    <div class="grid three">
      <div class="form-group">
        <label>Current Stock Value</label>
        <input type="number" id="stockAmount" value="100000" />
      </div>
      <div class="form-group">
        <label>Annual Stock Growth Rate (%)</label>
        <input type="number" step="0.01" id="stockRate" value="8.5" />
      </div>
      <div class="form-group">
        <label>Monthly Stock Contribution</label>
        <input type="number" id="stockMonthly" value="2000" />
      </div>
    </div>

    <button onclick="calculate()">Calculate</button>

    <table id="results" style="display:none">
      <thead>
        <tr>
          <th>Years</th>
          <th>Mortgage Payment</th>
          <th>Bank Balance</th>
          <th>Stock Value</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    function futureValue(principal, monthly, annualRate, months) {
      const r = annualRate / 100 / 12;
      let value = principal;
      for (let i = 0; i < months; i++) {
        value = value * (1 + r) + monthly;
      }
      return value;
    }
	
	function formatCurrency(value) {
		return value.toLocaleString(undefined, {
			minimumFractionDigits: 2,
			maximumFractionDigits: 2
		});
	}

    function mortgagePayment(amount, annualRate, months) {
      const r = annualRate / 100 / 12;
      return amount * (r * Math.pow(1 + r, months)) / (Math.pow(1 + r, months) - 1);
    }

	

    function calculate() {
      const mortgageAmount = +document.getElementById('mortgageAmount').value;
      const mortgageRate = +document.getElementById('mortgageRate').value;

      const bankAmount = +document.getElementById('bankAmount').value;
      const bankRate = +document.getElementById('bankRate').value;
      const bankMonthly = +document.getElementById('bankMonthly').value;

      const stockAmount = +document.getElementById('stockAmount').value;
      const stockRate = +document.getElementById('stockRate').value;
      const stockMonthly = +document.getElementById('stockMonthly').value;

      const yearsList = [5, 10, 15, 20, 25, 30];
      const tbody = document.querySelector('#results tbody');
      tbody.innerHTML = '';

      yearsList.forEach(years => {
        const months = years * 12;
        const mortgage = mortgagePayment(mortgageAmount, mortgageRate, months);
        const bank = futureValue(bankAmount, bankMonthly, bankRate, months);
        const stock = futureValue(stockAmount, stockMonthly, stockRate, months);

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${years}</td>
          <td>$${formatCurrency(mortgage)}</td>
          <td>$${formatCurrency(bank)}</td>
          <td>$${formatCurrency(stock)}</td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById('results').style.display = 'table';
    }
  </script>
</body>
</html>
